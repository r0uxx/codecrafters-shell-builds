name: Build executables

# Builds r0uxx/codecrafters-shell-python for every OS. It lives in this separate repo because
# CodeCrafters' GitHub sync can't push workflow files. Run it from the Actions tab -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of codecrafters-shell-python to build"
        default: master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Signing/notarization only happens when these secrets exist, otherwise macOS builds are unsigned
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: r0uxx/codecrafters-shell-python
          ref: ${{ inputs.ref }}

      - uses: astral-sh/setup-uv@v6

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          keychain_password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm certificate.p12

          identity=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' certificate found in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: uv run --group build python build.py

      - name: Smoke test
        run: |
          output=$(printf 'echo hello\ntype tac\necho a b | tac\nexit\n' | ./dist/codecrafters-shell)
          echo "$output"
          grep -q "hello" <<< "$output"
          grep -q "tac is a shell builtin" <<< "$output"

      # A bare binary can't be stapled, Gatekeeper looks the ticket up online on first launch. So a submission
      # Apple is slow on doesn't have to block the build: once Apple accepts it, the uploaded binary passes too.
      - name: Notarize
        if: env.CODESIGN_IDENTITY != ''
        run: |
          auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          codesign --verify --strict --verbose=2 dist/codecrafters-shell
          ditto -c -k --keepParent dist/codecrafters-shell notarize.zip
          id=$(xcrun notarytool submit notarize.zip --output-format json "${auth[@]}" | jq -r .id)
          echo "Submission id: $id"
          xcrun notarytool wait "$id" --timeout 20m "${auth[@]}" || true
          status=$(xcrun notarytool info "$id" --output-format json "${auth[@]}" | jq -r .status)
          echo "Status: $status"
          case "$status" in
            Accepted) ;;
            "In Progress")
              echo "::warning::Apple is still notarizing $id, the binary is signed and will pass Gatekeeper once Apple accepts it" ;;
            *)
              xcrun notarytool log "$id" "${auth[@]}"
              exit 1 ;;
          esac

      # A tarball keeps the executable permission, which plain artifact zips lose
      - name: Package
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/codecrafters-shell.exe release/codecrafters-shell-${{ matrix.name }}.exe
          else
            tar -czf release/codecrafters-shell-${{ matrix.name }}.tar.gz -C dist codecrafters-shell
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: codecrafters-shell-${{ matrix.name }}
          path: release/*

  # Publishes every successful build as a release, so /releases/latest/download/<file> always points at the newest one
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        run: |
          sha=$(gh api repos/r0uxx/codecrafters-shell-python/commits/${{ inputs.ref }} --jq .sha)
          gh release create "build-${{ github.run_number }}" release/* \
            -R "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from r0uxx/codecrafters-shell-python@$sha. How to download and run: https://github.com/${{ github.repository }}#download"
